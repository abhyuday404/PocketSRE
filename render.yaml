# Personal, single-owner service. Deploying this blueprint incurs monthly charges.
services:
  - type: web
    name: pocketsre
    runtime: node
    plan: starter
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pocketsre/gateway... build
    startCommand: node services/gateway/dist/server.js
    healthCheckPath: /health
    disk:
      name: pocketsre-data
      mountPath: /var/data/pocketsre
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: GATEWAY_HOST
        value: 0.0.0.0
      - key: GATEWAY_ACCESS_TOKEN
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: POCKETSRE_EMBED_DEMO
        value: '1'
      - key: PROJECTS_PATH
        value: /var/data/pocketsre/projects
      - key: AUDIT_PATH
        value: /var/data/pocketsre/actions.json
      - key: INCIDENT_PATH
        value: /var/data/pocketsre/incidents.json
      - key: MONITOR_PATH
        value: /var/data/pocketsre/monitor.json
