services:
  demo-service:
    build: .
    command: node services/demo-service/dist/server.js
    environment:
      DEMO_SERVICE_HOST: 0.0.0.0
      DEMO_SERVICE_PORT: 4200

  gateway:
    build: .
    volumes:
      - action-ledger:/data
    ports:
      - '${GATEWAY_BIND_ADDRESS:-127.0.0.1}:4100:4100'
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 4100
      DEMO_SERVICE_URL: http://demo-service:4200
      GATEWAY_ACCESS_TOKEN: ${GATEWAY_ACCESS_TOKEN:?Set a strong gateway access token}
    depends_on:
      - demo-service

volumes:
  action-ledger:
